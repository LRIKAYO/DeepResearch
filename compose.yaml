services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: researchflow
      POSTGRES_PASSWORD: researchflow_dev_only
      POSTGRES_DB: researchflow
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchflow -d researchflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
