# Full local stack: postgres + backend + agent, all built from the local Dockerfile.
#
#   docker compose up -d --build          # everything
#   docker compose up -d postgres         # database only
#
# The Next.js frontend is NOT containerised: run it separately with pnpm dev
# in ./frontend (it talks to the backend on 127.0.0.1:8000 and the agent on
# 127.0.0.1:2024). This is the only compose file in the repository on purpose:
# Compose silently prefers compose.yaml over docker-compose.yml, so keeping
# both would start the wrong stack.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: researchflow
      POSTGRES_PASSWORD: researchflow_dev_only
      POSTGRES_DB: researchflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchflow -d researchflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: researchflow:local
    command: uvicorn researchflow.backend.app:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network "127.0.0.1" is the container itself, so the
      # service names below override whatever .env points at on the host.
      RESEARCHFLOW_DATABASE_URL: postgresql+psycopg://researchflow:researchflow_dev_only@postgres:5432/researchflow
      RESEARCHFLOW_TEST_DATABASE_URL: postgresql+psycopg://researchflow:researchflow_dev_only@postgres:5432/researchflow_test
      RESEARCHFLOW_LANGGRAPH_URL: http://agent:2024
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  agent:
    # Reuses the image built by the backend service above.
    image: researchflow:local
    # --no-reload: the image is static, and a reload would clear the in-memory
    # thread store, orphaning every session that already holds a thread id.
    command: langgraph dev --host 0.0.0.0 --port 2024 --no-browser --allow-blocking --no-reload
    env_file:
      - path: .env
        required: false
    environment:
      RESEARCHFLOW_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "2024:2024"

volumes:
  postgres_data:
