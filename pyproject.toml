[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchflow"
version = "0.1.0"
description = "ResearchFlow agent contracts"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "langchain-core",
    "langchain-openai",
    "langgraph==1.2.11",
    "pydantic>=2,<3",
    "typing_extensions",
    "tavily-python",
]

[project.optional-dependencies]
backend = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16",
    "psycopg[binary]",
    "pgvector",
    "python-multipart",
    "langgraph-sdk==0.4.3",
]
dev = [
    "langgraph-api==0.13.0; python_version >= '3.11'",
    "langgraph-cli[inmem]==0.4.31; python_version >= '3.11'",
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = "%(here)s/src"
